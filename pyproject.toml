[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whp-language-decoder"
version = "0.2.0"
description = "Profile-driven historical-language and script decoder for the World History Project"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
whp-decode = "decoder.cli:main"

[tool.setuptools]
packages = ["decoder"]
