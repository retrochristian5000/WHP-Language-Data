profile:
  id: old_saxon
  name: Old Saxon
  native_names: [altsahsisc]
  iso_639_3: osx
  glottocode: olds1250
  family: [Indo-European, Germanic, West Germanic]
  status: extinct
  scope: >-
    Broad decoding of normalized editorial Old Saxon, especially Heliand
    spellings. This is not manuscript OCR and does not assume one uniform dialect.

script:
  primary: Latin
  manuscript_context: Carolingian minuscule
  direction: ltr

chronology:
  anchor: {work: Heliand, date: 9th century CE}
  note: The attestation anchor is not a claim that every form is contemporaneous.

normalization:
  unicode_form: NFC
  casefold: true
  replacements:
    - {from: "ſ", to: "s", reason: "Normalize long s and report the change."}

decoder:
  output_notation: IPA-broad
  match_policy: longest-first
  graphemes:
    "uu":
      candidates: [{value: "w", confidence: high}]
      note: Common Heliand editorial spelling for the w-type consonant.
    "th":
      candidates: [{value: "θ", confidence: medium}, {value: "ð", confidence: medium}]
      note: Voicing remains context-, dialect-, and edition-sensitive.
    "sc":
      candidates: [{value: "sk", confidence: medium}]
      note: Old English palatalization is not imported automatically.
    "qu": {candidates: [{value: "kw", confidence: high}]}
    "ng":
      candidates: [{value: "ŋg", confidence: medium}, {value: "ŋ", confidence: low}]
    "ƀ":
      candidates: [{value: "β", confidence: medium}, {value: "v", confidence: medium}, {value: "b", confidence: low}]
      note: The editorial sign is preserved as an explicit interpretive choice.
    "þ": {candidates: [{value: "θ", confidence: medium}, {value: "ð", confidence: medium}]}
    "ð": {candidates: [{value: "ð", confidence: medium}, {value: "θ", confidence: low}]}
    "â": {candidates: [{value: "aː", confidence: high}]}
    "ê": {candidates: [{value: "eː", confidence: high}]}
    "î": {candidates: [{value: "iː", confidence: high}]}
    "ô": {candidates: [{value: "oː", confidence: high}]}
    "û": {candidates: [{value: "uː", confidence: high}]}
    "ā": {candidates: [{value: "aː", confidence: high}]}
    "ē": {candidates: [{value: "eː", confidence: high}]}
    "ī": {candidates: [{value: "iː", confidence: high}]}
    "ō": {candidates: [{value: "oː", confidence: high}]}
    "ū": {candidates: [{value: "uː", confidence: high}]}
    "eo": {candidates: [{value: "eo", confidence: low}, {value: "eːo", confidence: low}]}
    "io": {candidates: [{value: "io", confidence: low}]}
    "ie": {candidates: [{value: "ie", confidence: low}]}
    "iu": {candidates: [{value: "iu", confidence: low}]}
    "uo": {candidates: [{value: "uo", confidence: low}]}
    "ai": {candidates: [{value: "ai", confidence: low}]}
    "ei": {candidates: [{value: "ei", confidence: low}]}
    "au": {candidates: [{value: "au", confidence: low}]}
    "a": {candidates: [{value: "a", confidence: medium}]}
    "b": {candidates: [{value: "b", confidence: medium}, {value: "β", confidence: low}]}
    "c": {candidates: [{value: "k", confidence: medium}]}
    "d": {candidates: [{value: "d", confidence: high}]}
    "e": {candidates: [{value: "e", confidence: medium}]}
    "f": {candidates: [{value: "f", confidence: medium}, {value: "v", confidence: low}]}
    "g": {candidates: [{value: "g", confidence: medium}, {value: "ɣ", confidence: low}, {value: "j", confidence: low}]}
    "h": {candidates: [{value: "h", confidence: medium}, {value: "x", confidence: low}]}
    "i": {candidates: [{value: "i", confidence: medium}]}
    "j": {candidates: [{value: "j", confidence: medium}]}
    "k": {candidates: [{value: "k", confidence: high}]}
    "l": {candidates: [{value: "l", confidence: high}]}
    "m": {candidates: [{value: "m", confidence: high}]}
    "n": {candidates: [{value: "n", confidence: high}]}
    "o": {candidates: [{value: "o", confidence: medium}]}
    "p": {candidates: [{value: "p", confidence: high}]}
    "r": {candidates: [{value: "r", confidence: medium}]}
    "s": {candidates: [{value: "s", confidence: medium}, {value: "z", confidence: low}]}
    "t": {candidates: [{value: "t", confidence: high}]}
    "u": {candidates: [{value: "u", confidence: medium}]}
    "v": {candidates: [{value: "v", confidence: low}, {value: "u", confidence: low}]}
    "w": {candidates: [{value: "w", confidence: high}]}
    "x": {candidates: [{value: "ks", confidence: medium}]}
    "y": {candidates: [{value: "y", confidence: low}, {value: "i", confidence: low}]}
    "z": {candidates: [{value: "z", confidence: low}]}

limitations:
  - No automatic translation, lemmatization, or morphology yet.
  - No manuscript-specific scribal-hand model.
  - Broad candidates are not one reconstructed pronunciation.
  - Contextual rules remain alternatives rather than silent transformations.

examples:
  - {input: "thesa uuerold", expected_primary: "θesa werold"}
  - {input: "heƀenrîki", expected_primary: "heβenriːki"}

